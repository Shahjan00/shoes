<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride – Shoe Store</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--s-bg:#e9e9ec;--s-card:#fff;--s-ink:#0b0b0c;--s-mut:#6b6b73;--s-line:#dcdce1;--s-tile:#f0f0f2;--s-acc:#ff4b2b;--s-hot:#ff4b2b;--s-ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--s-bg:#09090a;--s-card:#141416;--s-ink:#f2f2f4;--s-mut:#8b8b94;--s-line:#26262b;--s-tile:#1c1c20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--s-bg);color:var(--s-ink);font:15px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3,h4{font-family:Unbounded,Manrope,sans-serif;margin:0;line-height:1.1;letter-spacing:-.03em;font-weight:600}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s-acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 26px;font-weight:700;cursor:pointer;background:var(--s-ink);color:var(--s-bg);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.acc{background:var(--s-ink);color:var(--s-bg)}.btn.ghost{background:var(--s-card);color:var(--s-ink);border:1px solid var(--s-line)}.btn.light{background:#fff;color:#0b0b0c}.btn.sm{padding:9px 16px;font-size:13px}.btn.red{background:var(--s-hot);color:#fff}.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.ib{background:none;border:0;padding:9px;border-radius:50%;cursor:pointer;position:relative;display:grid;place-items:center}.ib:hover{background:var(--s-tile)}
.bdg{position:absolute;top:1px;right:1px;background:var(--s-acc);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center}
.ann{background:var(--s-ink);color:var(--s-bg);text-align:center;font-size:12.5px;padding:7px 12px}
.nav{position:sticky;top:10px;z-index:30;margin:10px auto 0;max-width:1180px;width:calc(100% - 24px);background:var(--s-card);border-radius:99px;box-shadow:0 8px 30px #0000001f;padding:0 10px 0 14px;display:flex;align-items:center;gap:4px;height:60px}
.logo{font:600 19px Unbounded,sans-serif;letter-spacing:-.04em;margin-right:auto;display:flex;align-items:center;gap:9px}.logo img{height:34px}
.mk{width:34px;height:34px;border-radius:50%;background:var(--s-ink);color:var(--s-bg);display:grid;place-items:center;font:600 15px Unbounded;font-style:normal}
.links{display:flex;gap:6px;margin:0 auto 0 -60px}.links a{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px}.links a:hover{background:var(--s-tile)}
.hb{display:none}.sb{position:absolute;left:0;right:0;top:68px;background:var(--s-card);border-radius:22px;padding:8px 18px;box-shadow:0 12px 30px #0000002a}.sb input{width:100%;border:0;background:none;font-size:16px;outline:0;padding:8px 0}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 72% 48%,#ffffff22,transparent 55%),linear-gradient(#ffffff0c 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,#ffffff0c 1px,transparent 1px) 0 0/56px 56px,#0b0b0c;color:#fff;border-radius:34px;margin-top:-70px;padding:120px 44px 60px;min-height:660px;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:10px}
.bgw{position:absolute;left:50%;bottom:-.14em;transform:translateX(-50%);font:600 clamp(90px,23vw,320px)/1 Unbounded;color:transparent;-webkit-text-stroke:1.5px #ffffff30;white-space:nowrap;pointer-events:none;letter-spacing:-.06em}
.htx{position:relative;z-index:3}.hero h1{font-size:clamp(32px,5vw,64px);margin:16px 0}.hero p{color:#ffffffb8;max-width:400px;margin:0 0 26px}
.pill{display:inline-block;border:1px solid #ffffff44;border-radius:99px;padding:5px 15px;font-size:13px}
.row2{display:flex;gap:10px;flex-wrap:wrap}.hero .btn.ghost{background:transparent;color:#fff;border-color:#ffffff66}
.orb{position:relative;display:grid;place-items:center;min-height:440px}
.orb .hs{width:min(580px,100%);position:relative;z-index:2;filter:drop-shadow(0 40px 36px #000c);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(-2deg)}}
.ring{position:absolute;left:50%;top:66%;width:92%;aspect-ratio:3.2/1;border:1.5px solid #ffffff3a;border-radius:50%;transform:translate(-50%,-50%)}.ring.r2{width:68%;border-style:dashed;border-color:#ffffff26}
.spec{position:absolute;z-index:3;background:#ffffff14;backdrop-filter:blur(12px);border:1px solid #ffffff26;border-radius:18px;padding:10px 16px;font-size:12px;color:#ffffffb8}.spec b{display:block;color:#fff;font:600 16px Unbounded}
.s1{left:0;top:10%}.s2{right:0;top:30%}.s3{left:6%;bottom:6%}
.cr{display:flex;gap:16px;overflow-x:auto;padding:22px 4px 6px}.cc{flex:none;text-align:center;width:88px;font-size:13px;font-weight:700}.cc i{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--s-card);font:600 22px Unbounded;margin:0 auto 6px;transition:.2s}.cc:hover i{background:var(--s-ink);color:var(--s-bg)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:36px 0 16px;gap:10px}.sh h2{font-size:clamp(20px,3vw,30px)}.sh>a{font-weight:700;border-bottom:2px solid var(--s-ink)}.ctr{text-align:center;margin:56px 0 20px;font-size:clamp(22px,3.4vw,34px)}
.ar{display:flex;gap:6px}.ar button{width:42px;height:42px;border:1px solid var(--s-line);background:var(--s-card);border-radius:50%;cursor:pointer;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--s-card);border-radius:26px;padding:10px;transition:box-shadow .2s}.card:hover{box-shadow:0 18px 40px #00000020}
.card .im{position:relative;display:block;border-radius:20px;overflow:hidden;aspect-ratio:1/.86;background:var(--s-tile)}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .im img{transform:scale(1.06)}
.ct{position:absolute;top:10px;right:10px;background:var(--s-card);border-radius:99px;font-size:12px;padding:3px 12px;font-weight:700}
.tag{position:absolute;top:10px;left:10px;background:var(--s-acc);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px}
.oos{position:absolute;left:10px;bottom:10px;background:var(--s-ink);color:var(--s-bg);font-size:12px;padding:3px 12px;border-radius:99px}
.ci{padding:12px 8px 6px}.ci h3{font:700 16px Manrope;letter-spacing:0;margin-bottom:6px}
.mt{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--s-mut);gap:8px}
.pr{display:flex;gap:8px;align-items:baseline}.pr strong{font-size:16px;color:var(--s-ink)}.pr s{color:var(--s-mut);font-size:13px}
.star{color:#f5a524;font-style:normal;letter-spacing:2px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:13px;height:13px;border-radius:50%;border:1px solid var(--s-line)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.feat{display:grid;grid-template-columns:1.1fr 1fr;background:#0b0b0c;color:#fff;border-radius:34px;overflow:hidden;margin:44px 0}
.fi{background:radial-gradient(circle at 50% 50%,#ffffff26,transparent 62%);padding:30px;display:grid;place-items:center}.fi img{width:100%;max-width:520px}
.ft{padding:44px}.ft h2{font-size:clamp(24px,3.4vw,40px);margin:14px 0}.ft p{color:#ffffffa8}.ft .pr strong,.ft .pr s{color:#fff}.ft .pr s{opacity:.55}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.tiles div{background:#ffffff12;border-radius:18px;padding:14px;font-size:12px;color:#ffffffa0}.tiles b{display:block;color:#fff;font:600 24px Unbounded}
.sc{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.sc .card{flex:0 0 min(290px,78%);scroll-snap-align:start}
.news{background:#0b0b0c;color:#fff;border-radius:30px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin:50px 0 0}.news h2{font-size:clamp(22px,3.2vw,34px)}.news p{color:#ffffffa0;margin:0 0 12px}
.nw{display:flex;background:#fff;border-radius:99px;padding:5px}.nw input{border:0;outline:0;flex:1;padding:0 16px;background:none;color:#0b0b0c;min-width:0}.nw .btn{background:#0b0b0c;color:#fff;padding:10px 22px}
.foot{background:var(--s-card);border-radius:34px 34px 0 0;margin-top:44px;padding:44px 0 30px}.foot .g{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.4fr;gap:28px}.foot h4{font:700 14px Manrope;letter-spacing:0;margin:0 0 12px}.foot a,.foot span.l{display:block;padding:3px 0;color:var(--s-mut)}.foot a:hover{color:var(--s-ink)}.foot p{color:var(--s-mut);max-width:280px}
.soc{display:flex;gap:8px}.soc a{width:34px;height:34px;border-radius:50%;background:var(--s-tile);display:grid!important;place-items:center;font-weight:700;font-size:12px;color:var(--s-ink)!important;padding:0!important}
.foot .cp{border-top:1px solid var(--s-line);margin-top:28px;padding-top:16px;font-size:13px;color:var(--s-mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.pays{display:flex;gap:6px}.pays b{border:1px solid var(--s-line);border-radius:8px;padding:2px 10px;font-size:11px;color:var(--s-ink)}
.sp{position:relative;border-radius:34px;overflow:hidden;margin-top:-70px;height:330px;background:linear-gradient(#ffffff10 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/48px 48px,linear-gradient(135deg,#0b0b0c,#3a3a42 60%,#0b0b0c)}
.bw{position:absolute;left:50%;top:70px;transform:translateX(-50%);font:600 clamp(110px,26vw,300px)/1 Unbounded;color:#fff;letter-spacing:-.07em}
.sbx{position:absolute;left:0;right:0;bottom:0;background:var(--s-card);border-radius:26px 26px 0 0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px}.sbx h2{font-size:clamp(17px,2.4vw,26px)}
.sq2{display:flex;background:var(--s-tile);border-radius:99px;padding:4px;flex:0 1 380px}.sq2 input{flex:1;border:0;background:none;outline:0;padding:0 16px;min-width:0}
.shl{display:grid;grid-template-columns:210px 1fr;gap:26px;margin-top:26px}.fs h4{font:700 15px Manrope;letter-spacing:0;margin:0 0 8px}
.fs button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}.fs button.on{background:var(--s-card)}.fs em{font-style:normal;color:var(--s-mut);font-size:12px}.fs .in{margin-top:6px}
.pg{display:flex;justify-content:center;gap:6px;margin-top:26px;align-items:center}.pg button{min-width:38px;height:38px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:700}.pg button.on{background:var(--s-card)}.pg button[disabled]{opacity:.35}
.crumb{display:flex;gap:8px;align-items:center;color:var(--s-mut);font-size:13px;margin:26px 0 14px}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:34px}.gal .main{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:1;background:var(--s-tile)}.gal .main>img{width:100%;height:100%;object-fit:cover}
.th{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}.th img{aspect-ratio:1;object-fit:cover;border-radius:16px;border:3px solid transparent;cursor:pointer;opacity:.92}.th img.on{border-color:#fff;opacity:1}
.pdp h1{font-size:clamp(24px,3.2vw,36px);margin:10px 0}.big{font:600 28px Unbounded}.off{background:var(--s-acc);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px}
.dl{border:1px solid var(--s-line);border-radius:99px;padding:8px 16px;font-size:13px;color:var(--s-mut);margin:14px 0;background:var(--s-card)}.dl b{color:var(--s-ink)}
.lab{font-weight:700;margin:18px 0 8px;display:block;font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:10px}.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--s-card);box-shadow:0 0 0 1px var(--s-line);cursor:pointer}.sw button.on{box-shadow:0 0 0 2px var(--s-ink)}.sw button.x{opacity:.35}
.szp{display:flex;flex-wrap:wrap;gap:8px}.szp button{min-width:64px;height:48px;border-radius:99px;border:0;background:var(--s-card);cursor:pointer;font-weight:600}.szp button.on{background:var(--s-ink);color:var(--s-bg)}.szp button.x{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.qty{display:inline-flex;align-items:center;border:1px solid var(--s-line);border-radius:99px;background:var(--s-card)}.qty button{width:38px;height:38px;border:0;background:none;font-size:20px;cursor:pointer}.qty span{min-width:28px;text-align:center;font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.acts .btn{flex:1;min-width:150px;padding:16px}
.acd{background:var(--s-card);border-radius:20px;padding:14px 18px;margin-bottom:10px}.acd summary{font-weight:700;cursor:pointer}.acd p{color:var(--s-mut);margin:10px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.g2 div{font-size:12px;color:var(--s-mut)}.g2 b{display:block;color:var(--s-ink);font-size:14px}
.rv{display:grid;grid-template-columns:auto 1fr 1.3fr;gap:36px;align-items:center}.rv .num{font:600 84px/1 Unbounded}.rv .num small{font-size:20px;color:var(--s-mut)}
.bars div{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:600;font-size:13px}.bars i{flex:1;height:7px;border-radius:9px;background:var(--s-line);overflow:hidden}.bars u{display:block;height:100%;background:var(--s-ink)}
.rcs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory}.rc{flex:0 0 min(340px,85%);scroll-snap-align:start;background:var(--s-card);border-radius:22px;padding:18px}.rc small{color:var(--s-mut)}.rc p{margin:8px 0 0}
.dock{display:none}
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:flex-end}.ov.l{justify-content:flex-start}.ov.c{align-items:center;justify-content:center}
.dr{background:var(--s-bg);width:min(420px,100%);height:100%;display:flex;flex-direction:column;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dh h3{font-size:20px}
.mo{background:var(--s-card);border-radius:26px;margin:auto;width:min(460px,92%);padding:24px;max-height:92%;overflow:auto}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--s-line)}.li img{width:74px;height:74px;border-radius:14px;object-fit:cover}.li>div{flex:1}.li h4{margin:0;font:700 15px Manrope;letter-spacing:0}.li small{color:var(--s-mut)}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font:600 18px Unbounded;border-top:1px solid var(--s-line);margin-top:6px;padding-top:10px}
.in{width:100%;padding:11px 14px;border:1.5px solid var(--s-line);border-radius:12px;background:var(--s-card);margin-bottom:10px}
.row{display:flex;gap:8px}.row>*{flex:1}.row .btn{flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:7px 16px;border-radius:99px;border:1.5px solid var(--s-line);background:var(--s-card);cursor:pointer}.chip.on{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.empty{text-align:center;color:var(--s-mut);padding:50px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s-ink);color:var(--s-bg);padding:11px 20px;border-radius:99px;z-index:99;font-weight:600;max-width:90%}
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#0b0b0c;color:#c9c9d1;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #26262b}.side .logo{color:#fff;padding:0 10px 16px}.side .mk{background:#fff;color:#0b0b0c}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 14px;border-radius:12px;cursor:pointer;margin-bottom:2px}.side button:hover{background:#ffffff14}.side button.on{background:#fff;color:#0b0b0c;font-weight:700}
.main{padding:28px;min-width:0}.main h2{font-size:28px;margin-bottom:6px}.sub{color:var(--s-mut);margin:0 0 22px}
.pn{background:var(--s-card);border-radius:22px;padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stats .pn b{font:600 34px Unbounded;display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fl{font-size:13px;font-weight:700;display:block;margin:2px 0 4px}
.ck{display:flex;gap:10px;align-items:center;font-weight:700;margin:10px 0;cursor:pointer}.ck input{width:20px;height:20px;accent-color:var(--s-ink)}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.imgs div{position:relative}.imgs img{width:84px;height:84px;object-fit:cover;border-radius:14px}.imgs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--s-hot);color:#fff;cursor:pointer;line-height:1}
.tr{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--s-line);flex-wrap:wrap}.tr:last-child{border:0}.tr>.g{flex:1;min-width:150px}.tr img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.tr .hv{opacity:0;transition:opacity .15s}.tr:hover .hv,.tr:focus-within .hv{opacity:1}@media(hover:none){.tr .hv{opacity:1}}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#12805c22;color:var(--s-ok);border:0;cursor:pointer}.st.no{background:#ff4b2b22;color:var(--s-hot)}
.cb{border:1px dashed var(--s-line);border-radius:16px;padding:14px;margin:10px 0}
@media(max-width:860px){
body{padding-bottom:84px}.links{display:none}.hb{display:grid}
.hero{grid-template-columns:1fr;padding:110px 22px 40px;min-height:0;border-radius:28px}.orb{min-height:300px}.s1{top:0}.s2{top:20%}.s3{bottom:0}
.grid,.grid.g3{grid-template-columns:repeat(2,1fr);gap:10px}.card{border-radius:22px}.qa{grid-template-columns:1fr}
.feat,.news,.pdp,.rv{grid-template-columns:1fr}.ft{padding:26px}.rv{gap:18px}
.shl{grid-template-columns:1fr}.fs{display:flex;gap:6px;overflow-x:auto}.fs h4{display:none}.fs button{white-space:nowrap;width:auto;background:var(--s-card);gap:8px}.fs .in{display:none}
.sbx{flex-direction:column;align-items:stretch;padding:12px 16px}.sq2{flex:none}.sp{height:300px}.bw{top:50px}
.foot .g{grid-template-columns:1fr 1fr}.foot{border-radius:28px 28px 0 0}
.dock{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--s-card);border-radius:99px;padding:6px;gap:4px;box-shadow:0 10px 30px #0000003a}
.dock a,.dock button{width:52px;height:52px;border-radius:50%;border:0;background:none;display:grid;place-items:center;position:relative;cursor:pointer}.dock .on{background:var(--s-ink);color:var(--s-bg)}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.adm{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow-x:auto;padding:10px;gap:4px}.side .logo{display:none}.side button{width:auto;white-space:nowrap}.main{padding:18px}.stats{grid-template-columns:1fr 1fr}.f2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v3 */
:root{--s-glow1:#c7d2ff80;--s-glow2:#ffd2c47a;--s-glass:#ffffffd6}

.wrap{width:min(92%,1600px);max-width:none;padding:0}

const fld=(l,n,v,t='text',x='')=>`<div><label class="fl">${l}</label><input class="in" type="${t}" data-f="${n}" value="${esc(v)}" ${x}></div>`;
const upl=(k,imgs,rm)=>`<div class="imgs">${imgs.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button data-a="${rm}" data-v="${i}" ${k[0]==="c"&&k!=="logo"?`data-i="${k.slice(1)}"`:""} aria-label="Remove image">×</button></div>`).join('')}</div><input type="file" accept="image/*" multiple data-up="${k}">`;
const mainCol=(c,i)=>`<div class="cb"><b>Main colour</b> <small style="color:var(--s-mut)">uses the main photos, title and price above</small><div class="f2"><div><label class="fl">Colour name</label><input class="in" data-cf="name" data-i="${i}" value="${esc(c.name)}" placeholder="e.g. Red"></div><div><label class="fl">Swatch</label><input class="in" type="color" data-cf="hex" data-i="${i}" value="${esc(c.hex)}" style="padding:2px;height:44px"></div></div><button class="st${c.stock?'':' no'}" data-a="cst" data-i="${i}">${c.stock?'In stock':'Out of stock'}</button></div>`;
function form(){const d=S.draft;return`<div class="pn"><div class="f2">${fld('Title','title',d.title)}<div><label class="fl">Category</label><select class="in" data-f="cat"><option value="">Select…</option>${db.cats.map(c=>`<option value="${c.id}"${c.id===d.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${fld('Brand','brand',d.brand)}${fld('Rating (0–5)','rating',d.rating,'number','step="0.1" min="0" max="5"')}${fld('Price before discount (MRP) ₹','mrp',d.mrp,'number','min="0"')}${fld('Offer price ₹','price',d.price,'number','min="0"')}</div>
<label class="fl">Description</label><textarea class="in" rows="3" data-f="desc">${esc(d.desc)}</textarea>
${d.mrp>d.price&&d.price>0?`<p class="sub">Customers will see <b>${off(d.mrp,d.price)}% off</b>.</p>`:''}
<label class="fl">${d.hasColors?'Main photos (these belong to colour 1 below)':'Product images'}</label>${upl('main',d.images,'rmi')}
<label class="ck"><input type="checkbox" data-f="hasColors" ${d.hasColors?'checked':''}>Has multiple colors</label>
${d.hasColors?d.colors.map((c,i)=>c.main?mainCol(c,i):`<div class="cb"><div class="f2"><div><label class="fl">Color name</label><input class="in" data-cf="name" data-i="${i}" value="${esc(c.name)}"></div><div><label class="fl">Swatch</label><input class="in" type="color" data-cf="hex" data-i="${i}" value="${esc(c.hex)}" style="padding:2px;height:44px"></div><div><label class="fl">Title for this color</label><input class="in" data-cf="title" data-i="${i}" value="${esc(c.title)}"></div><div><label class="fl">Price ₹</label><input class="in" type="number" min="0" data-cf="price" data-i="${i}" value="${esc(c.price)}"></div></div>${upl('c'+i,c.images,'rmci')}<div class="row" style="margin-top:8px"><button class="st${c.stock?'':' no'}" data-a="cst" data-i="${i}">${c.stock?'In stock':'Out of stock'}</button><button class="btn sm red" data-a="rcol" data-i="${i}">Remove color</button></div></div>`).join('')+'<button class="btn sm" data-a="acol">+ Add color</button>':''}
<label class="ck"><input type="checkbox" data-f="hasSizes" ${d.hasSizes?'checked':''}>Sizes available</label>
${d.hasSizes?`<div class="row"><input class="in" id="szin" placeholder="e.g. UK8, UK9 or XS, S, M" style="margin:0"><button class="btn sm" data-a="asz">Add</button></div><p class="sub" style="margin:8px 0">Presets: <a href="#/admin" data-a="pre" data-v="${UK.join(',')}"><u>Shoes UK6–11</u></a> · <a href="#/admin" data-a="pre" data-v="XS,S,M,L,XL"><u>Clothes XS–XL</u></a></p><div class="chips">${d.sizes.map((z,i)=>`<span class="chip ${z.s?'on':''}"><a href="#/admin" data-a="szt" data-i="${i}" title="Tap to toggle availability">${esc(z.n)}${z.s?'':' (out)'}</a> <a href="#/admin" data-a="szx" data-i="${i}">✕</a></span>`).join('')}</div><small>Tap a size to mark it out of stock.</small>`:''}
<label class="ck"><input type="checkbox" data-f="stock" ${d.stock?'checked':''}>Available for sale</label><label class="ck"><input type="checkbox" data-f="pinned" ${d.pinned?'checked':''}>Pin to home page</label>
<div class="row" style="margin-top:14px"><button class="btn acc" data-a="saveP">${d.id?'Save changes':'Add product'}</button>${d.id?'<button class="btn ghost" data-a="canc">Cancel</button>':''}</div></div>`}
function dashHtml(){const rg=S.drange,os=db.orders.filter(o=>inRange(o.date,rg)),sales=os.reduce((a,o)=>a+o.total,0),units=os.reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.q,0),0),n=rg==='all'?30:+rg,days=[];
for(let k=n-1;k>=0;k--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);days.push({d,v:0})}
db.orders.forEach(o=>{const t=new Date(o.date);t.setHours(0,0,0,0);const x=days.find(y=>y.d.getTime()===t.getTime());if(x)x.v+=o.total});
const mx=Math.max(1,...days.map(x=>x.v)),top={};os.forEach(o=>o.items.forEach(i=>{const t=top[i.title]||(top[i.title]={q:0,r:0});t.q+=i.q;t.r+=i.q*i.price}));
const tp=Object.entries(top).sort((a,b)=>b[1].r-a[1].r).slice(0,5),tm=Math.max(1,...tp.map(x=>x[1].r)),cnt=x=>os.filter(o=>o.status===x).length,avg=db.reviews.length?(db.reviews.reduce((a,r)=>a+r.stars,0)/db.reviews.length).toFixed(1)+' ★':'–';
const tiles=[['Total sales',inr(sales)],['Orders',os.length],['Avg order value',inr(os.length?Math.round(sales/os.length):0)],['Units sold',units],['Customers',db.users.length],['Pending orders',cnt('pending')],['Out of stock',db.products.filter(p=>!inStock(p)).length],['Avg rating',avg]];
return`<h2>Analytics</h2><p class="sub">How your store is doing.</p><div class="row" style="margin-bottom:14px;max-width:260px"><select class="in" data-adm="drange" style="margin:0" aria-label="Time range"><option value="7"${rg==='7'?' selected':''}>Last 7 days</option><option value="30"${rg==='30'?' selected':''}>Last 30 days</option><option value="90"${rg==='90'?' selected':''}>Last 90 days</option><option value="all"${rg==='all'?' selected':''}>All time</option></select></div>
<div class="stats">${tiles.map(([k,v])=>`<div class="pn"><b>${v}</b>${k}</div>`).join('')}</div>
<div class="g3c"><div class="pn"><b>Sales per day</b><small style="display:block;color:var(--s-mut);margin-bottom:10px">Last ${n} days · hover a bar</small><div class="chart">${days.map(x=>`<i style="height:${Math.max(2,x.v/mx*100)}%" title="${x.d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}: ${inr(x.v)}"></i>`).join('')}</div></div>
<div class="pn"><b>Order status</b>${ST.map(x=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between">${stt(x)}<b>${cnt(x)}</b></div><div class="topb"><u style="width:${os.length?cnt(x)/os.length*100:0}%;background:${SC[x]}"></u></div></div>`).join('')}</div></div>
<div class="g3c"><div class="pn"><b>Top products</b>${tp.map(([k,v])=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(k)} <small style="color:var(--s-mut)">× ${v.q}</small></span><b>${inr(v.r)}</b></div><div class="topb"><u style="width:${v.r/tm*100}%"></u></div></div>`).join('')||'<div class="empty">No sales in this period.</div>'}</div>
<div class="pn"><b>Recent orders</b>${db.orders.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(o=>`<div class="tr" data-a="oopen" data-id="${o.id}" style="cursor:pointer"><div class="g"><b>${o.id}</b> · ${esc(o.name)}<br><small>${fdt(o.date)}</small></div>${stt(o.status)}<b>${inr(o.total)}</b></div>`).join('')||'<div class="empty">No orders yet.</div>'}</div></div>`}
function ordersHtml(){const base=db.orders.filter(o=>inRange(o.date,S.orng)&&(!S.oq||(o.id+o.name+o.phone).toLowerCase().includes(S.oq.toLowerCase())));let l=base.filter(o=>!S.ost||o.status===S.ost);
l.sort((a,b)=>S.osort==='old'?a.date.localeCompare(b.date):S.osort==='hi'?b.total-a.total:S.osort==='lo'?a.total-b.total:b.date.localeCompare(a.date));const sales=l.reduce((a,o)=>a+o.total,0);
return`<h2>Orders</h2><p class="sub">Tap an order for customer and product details and to update its status. Customers are emailed on every change.</p><div class="stats"><div class="pn"><b>${inr(sales)}</b>Sales (filtered)</div><div class="pn"><b>${l.length}</b>Orders</div><div class="pn"><b>${inr(l.length?Math.round(sales/l.length):0)}</b>Avg order</div><div class="pn"><b>${l.filter(o=>o.status==='pending').length}</b>Pending</div></div>
<div class="pn"><div class="chips"><button class="chip${S.ost?'':' on'}" data-a="ost" data-v="">All ${base.length}</button>${ST.map(x=>`<button class="chip${S.ost===x?' on':''}" data-a="ost" data-v="${x}">${cap(x)} ${base.filter(o=>o.status===x).length}</button>`).join('')}</div><div class="f2"><div><label class="fl">Time</label><select class="in" data-adm="orng"><option value="today"${S.orng==='today'?' selected':''}>Today</option><option value="7"${S.orng==='7'?' selected':''}>Last 7 days</option><option value="30"${S.orng==='30'?' selected':''}>Last 30 days</option><option value="all"${S.orng==='all'?' selected':''}>All time</option></select></div><div><label class="fl">Sort by</label><select class="in" data-adm="osort"><option value="new"${S.osort==='new'?' selected':''}>Newest first</option><option value="old"${S.osort==='old'?' selected':''}>Oldest first</option><option value="hi"${S.osort==='hi'?' selected':''}>Amount: high to low</option><option value="lo"${S.osort==='lo'?' selected':''}>Amount: low to high</option></select></div></div><label class="fl">Search</label><input class="in" data-adm="oq" placeholder="Order ID, name or phone, then press Enter" value="${esc(S.oq)}" style="margin:0"></div>
<div class="pn">${l.map(o=>`<div class="tr" data-a="oopen" data-id="${o.id}" style="cursor:pointer"><div class="g"><b>${o.id}</b> · ${esc(o.name)}<br><small>${fdt(o.date)} · ${o.items.length} item${o.items.length>1?'s':''} · ${esc(o.phone)}</small></div>${stt(o.status)}<b>${inr(o.total)}</b></div>`).join('')||'<div class="empty">No orders match these filters.</div>'}</div>`}
function reviewsHtml(){let l=db.reviews.filter(r=>(!S.rpin||r.pinned)&&(!S.rstar||r.stars===+S.rstar)&&(!S.rq||(r.name+r.product+r.text+r.phone).toLowerCase().includes(S.rq.toLowerCase())));
l.sort((a,b)=>S.rsort==='old'?a.date.localeCompare(b.date):S.rsort==='hi'?b.stars-a.stars||b.date.localeCompare(a.date):S.rsort==='lo'?a.stars-b.stars||b.date.localeCompare(a.date):b.date.localeCompare(a.date));
const avg=db.reviews.length?(db.reviews.reduce((a,r)=>a+r.stars,0)/db.reviews.length).toFixed(1):'–';
return`<h2>Reviews</h2><p class="sub">Pinned reviews slide on the home page. Unpinned ones stay here only.</p><div class="stats"><div class="pn"><b>${db.reviews.length}</b>Total reviews</div><div class="pn"><b>${avg} ★</b>Average</div><div class="pn"><b>${db.reviews.filter(r=>r.pinned).length}</b>Pinned</div><div class="pn"><b>${db.reviews.filter(r=>r.stars<=2).length}</b>Low (1–2 ★)</div></div>
<div class="pn"><div class="chips"><button class="chip${S.rpin?'':' on'}" data-a="rpinf" data-v="0">All</button><button class="chip${S.rpin?' on':''}" data-a="rpinf" data-v="1">Pinned only</button></div><div class="f2"><div><label class="fl">Sort by</label><select class="in" data-adm="rsort"><option value="new"${S.rsort==='new'?' selected':''}>Latest</option><option value="old"${S.rsort==='old'?' selected':''}>Oldest</option><option value="hi"${S.rsort==='hi'?' selected':''}>Highest stars</option><option value="lo"${S.rsort==='lo'?' selected':''}>Lowest stars</option></select></div><div><label class="fl">Stars</label><select class="in" data-adm="rstar"><option value="">All ratings</option>${[5,4,3,2,1].map(i=>`<option value="${i}"${S.rstar==String(i)?' selected':''}>${i} stars</option>`).join('')}</select></div></div><input class="in" data-adm="rq" placeholder="Search name, phone, product or text, then press Enter" value="${esc(S.rq)}" style="margin:0"></div>
<div class="pn">${l.map(r=>`<div class="tr"><div class="tmav" style="width:48px;height:48px;font-size:18px;border-width:2px">${revAv(r)}</div><div class="g"><b>${esc(r.name)}</b> <small style="color:var(--s-mut)">${esc(r.phone)} · ${fd(r.date)}</small>${r.pinned?' <span class="stt" style="--c:#2f6fed">pinned</span>':''}<br>${starsH(r.stars)}${r.product?` <small style="color:var(--s-mut)">on ${esc(r.product)}</small>`:''}<p style="margin:4px 0 0">${esc(r.text)}</p></div><button class="btn sm ${r.pinned?'':'ghost'}" data-a="rpin" data-id="${r.id}">${r.pinned?'Unpin':'Pin to home'}</button><button class="ib" data-a="rdel" data-id="${r.id}" aria-label="Delete review">${ic('trash')}</button></div>`).join('')||'<div class="empty">No reviews match.</div>'}</div>`}
function adminLayer(){const o=S.ordId&&db.orders.find(x=>x.id===S.ordId);if(!o)return'';return`<div class="ov c" data-a="close"><div class="mo wide"><div class="dh"><h3>${o.id}</h3><button class="ib" data-a="close" aria-label="Close">${ic('x')}</button></div><small style="color:var(--s-mut)">${fdt(o.date)} · Payment ${o.pay} (${esc(o.payId)})</small><label class="fl" style="margin-top:14px">Status</label><select class="in" data-ost="${o.id}">${ST.map(x=>`<option value="${x}"${o.status===x?' selected':''}>${cap(x)}</option>`).join('')}</select><h4 class="mh">Customer</h4><p style="margin:0">${esc(o.name)}<br>${esc(o.phone)} · ${esc(o.email)}<br>${esc(o.address)}</p><h4 class="mh">Products</h4>${o.items.map(i=>{const p=gp(i.pid);return`<div class="li"><img src="${esc(p?thumb(p):shoe('#999'))}" alt=""><div><h4>${esc(i.title)}</h4><small>${esc([i.color,i.size].filter(Boolean).join(' · '))} × ${i.q}</small></div><b>${inr(i.price*i.q)}</b></div>`}).join('')}<div class="tot"><div><span>Subtotal</span><span>${inr(o.sub)}</span></div>${o.disc?`<div><span>Discount ${esc(o.codes.join(', '))}</span><span>−${inr(o.disc)}</span></div>`:''}<div><span>Shipping</span><span>${o.ship?inr(o.ship):'Free'}</span></div><div class="g"><span>Total</span><span>${inr(o.total)}</span></div></div><h4 class="mh">Status history</h4>${hist(o)}</div></div>`}
function admin(){const T=S.tab,c=db.coupons,ps=db.products;let b='';
if(T==='dash')b=dashHtml();if(T==='orders')b=ordersHtml();if(T==='reviews')b=reviewsHtml();
if(T==='pins')b=`<h2>Pinned items</h2><p class="sub">${ps.filter(p=>p.pinned).length} pinned items appear under “Trending now” on the home page.</p><div class="pn">${ps.map(p=>`<div class="tr"><img src="${esc(thumb(p))}" alt=""><div class="g"><b>${esc(p.title)}</b><br><small>${inr(p.price)}</small></div><button class="btn sm ${p.pinned?'acc':'ghost'}" data-a="pin" data-id="${p.id}">${p.pinned?'Unpin':'Pin'}</button></div>`).join('')||'<div class="empty">No products yet.</div>'}</div>`;
if(T==='cats')b=`<h2>Categories</h2><p class="sub">Group your shoes and give each category a cover image for the home page.</p><div class="pn"><div class="f2"><div><label class="fl">Name</label><input class="in" id="nc" placeholder="New category name"></div><div><label class="fl">Cover image (optional)</label><input class="in" id="nci" type="file" accept="image/*"></div></div><button class="btn" data-a="addc">Add category</button></div><div class="pn">${db.cats.map(k=>{const n=ps.filter(p=>p.cat===k.id).length;return`<div class="tr"><img src="${esc(catImg(k))}" alt=""><div class="g">${S.editCat===k.id?`<input class="in" id="ec" value="${esc(k.name)}" style="margin:0">`:`<b>${esc(k.name)}</b>`}<br><small>${n} product${n===1?'':'s'}</small></div>${S.editCat===k.id?`<label class="btn sm ghost" style="cursor:pointer">Change image<input type="file" accept="image/*" data-up="cat:${k.id}" hidden></label>${k.img?`<button class="btn sm ghost" data-a="rmcimg" data-id="${k.id}">Remove image</button>`:''}<button class="btn sm" data-a="savec" data-id="${k.id}">Save</button>`:`<button class="btn sm ghost" data-a="viewc" data-id="${k.id}">Show products</button><button class="ib" data-a="editc" data-id="${k.id}" aria-label="Edit">${ic('edit')}</button><button class="ib" data-a="delc" data-id="${k.id}" aria-label="Delete">${ic('trash')}</button>`}</div>`}).join('')||'<div class="empty">No categories yet.</div>'}</div>`;
if(T==='add')b=`<h2>${S.draft&&S.draft.id?'Edit item':'Add item'}</h2><p class="sub">Fill in the details customers will see.</p>${form()}`;
if(T==='prods'){const l=ps.filter(p=>!S.fcat||p.cat===S.fcat);b=`<h2>All products</h2><p class="sub">${l.length} item${l.length===1?'':'s'}${S.fcat?' in '+esc(catName(S.fcat))+' · <a href="#/admin" data-a="clrf"><u>show all</u></a>':''}. Edit an item to change stock for individual colors or sizes.</p><div class="pn">${l.map(p=>`<div class="tr"><img src="${esc(thumb(p))}" alt=""><div class="g"><b>${esc(p.title)}</b><br><small>${esc(catName(p.cat))} · ${inr(p.price)} <s>${inr(p.mrp)}</s></small></div><button class="st${p.stock?'':' no'}" data-a="pst" data-id="${p.id}">${p.stock?'In stock':'Out of stock'}</button><span class="hv"><button class="ib" data-a="editp" data-id="${p.id}" aria-label="Edit ${esc(p.title)}">${ic('edit')}</button><button class="ib" data-a="delp" data-id="${p.id}" aria-label="Delete ${esc(p.title)}">${ic('trash')}</button></span></div>`).join('')||'<div class="empty">No products here yet. Use “Add item”.</div>'}</div>`}
if(T==='coupons')b=`<h2>Coupons</h2><p class="sub">Create discount codes for sales and festivals.</p><div class="pn"><div class="f2"><div><label class="fl">Code</label><input class="in" id="k_code" placeholder="DIWALI20" style="text-transform:uppercase"></div><div><label class="fl">Discount type</label><select class="in" id="k_type"><option value="pct">Percent (%)</option><option value="flat">Flat amount (₹)</option></select></div><div><label class="fl">Discount value</label><input class="in" id="k_value" type="number" min="0"></div><div><label class="fl">Minimum order amount ₹</label><input class="in" id="k_min" type="number" min="0" value="0"></div><div><label class="fl">Start date</label><input class="in" id="k_start" type="date" value="${today()}"></div><div><label class="fl">End date</label><input class="in" id="k_end" type="date"></div><div><label class="fl">Total uses allowed</label><input class="in" id="k_limit" type="number" min="1" value="100"></div></div><label class="ck"><input type="checkbox" id="k_stack">Can be stacked with another coupon</label><button class="btn acc" data-a="addk">Create coupon</button></div><div class="pn">${c.map(k=>`<div class="tr"><div class="g"><b>${esc(k.code)}</b> — ${k.type==='pct'?k.value+'%':inr(k.value)} off over ${inr(k.min)}<br><small>${esc(k.start)} to ${esc(k.end)} · ${k.used}/${k.limit} used · ${k.stack?'stackable':'not stackable'}</small></div><button class="st${k.on?'':' no'}" data-a="kon" data-id="${esc(k.code)}">${k.on?'Active':'Paused'}</button><button class="ib" data-a="delk" data-id="${esc(k.code)}" aria-label="Delete">${ic('trash')}</button></div>`).join('')||'<div class="empty">No coupons yet.</div>'}</div>`;
if(T==='set'){const s=db.settings;b=`<h2>Settings</h2><p class="sub">Changes save automatically and update the whole site, including the footer.</p><div class="pn"><div class="f2">${[['Site name','name'],['Phone','phone'],['WhatsApp number (with country code)','whatsapp'],['Email','email'],['Address','address'],['Razorpay payment link / key','razorpay'],['Announcement bar text','announce'],['Free shipping above ₹','freeShip'],['Shipping fee ₹','shipFee']].map(([l,k])=>`<div><label class="fl">${l}</label><input class="in" data-s="${k}" value="${esc(s[k])}"></div>`).join('')}</div><label class="fl">Logo</label>${s.logo?`<div class="imgs"><div><img src="${esc(s.logo)}" alt=""><button data-a="rmlogo" aria-label="Remove logo">×</button></div></div>`:''}<input type="file" accept="image/*" data-up="logo"></div>`}
return`<div class="adm"><aside class="side">${brand().replace('href="#/"','href="#/"')}<small style="padding:0 14px;display:block;margin-bottom:10px">Admin panel</small>${TABS.map(([k,l])=>`<button class="${T===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}<button data-a="exit">← Back to store</button></aside><main class="main">${b}</main></div>${adminLayer()}`}

const newDraft=()=>({title:'',cat:'',brand:'Stride',mrp:'',price:'',desc:'',images:[],hasColors:false,colors:[],hasSizes:false,sizes:[],stock:true,pinned:false,rating:4.5,reviews:0});

const PAL=[['Black',[22,22,26]],['White',[240,240,240]],['Gray',[140,140,146]],['Red',[200,30,40]],['Orange',[240,120,30]],['Yellow',[240,200,40]],['Green',[40,150,80]],['Blue',[40,80,220]],['Navy',[25,40,100]],['Brown',[120,75,45]],['Beige',[210,190,150]],['Pink',[235,120,160]],['Purple',[130,70,190]]];
const sampleCol=src=>new Promise(res=>{const t=setTimeout(()=>res(null),1500),i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(i,0,0,24,24);const px=x.getImageData(0,0,24,24).data;let R=0,G=0,B=0,W=0,r2=0,g2=0,b2=0;for(let k=0;k<px.length;k+=4){const a=px[k],g=px[k+1],b=px[k+2],sat=(Math.max(a,g,b)-Math.min(a,g,b))/255,w=sat*sat*sat;R+=a*w;G+=g*w;B+=b*w;W+=w;r2+=a;g2+=g;b2+=b}const n=px.length/4;clearTimeout(t);res(W>1?[R/W,G/W,B/W]:[r2/n,g2/n,b2/n])}catch(e){res(null)}};i.onerror=()=>res(null);i.src=src});
async function fixMain(){let ch=false;for(const p of db.products){if(!p.hasColors||p.mc)continue;p.mc=1;
if(!p.colors.length||!p.images.length){if(p.colors[0])p.colors[0].main=true;continue}
if(p.colors[0].images[0]===p.images[0]){p.colors[0].main=true;continue}
const rgb=await sampleCol(p.images[0]);let name='Default',hex='#888888';if(rgb){hex='#'+rgb.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');name=PAL.map(([n,c])=>[n,Math.hypot(c[0]-rgb[0],c[1]-rgb[1],c[2]-rgb[2])]).sort((a,b)=>a[1]-b[1])[0][0]}
p.colors.unshift({name,hex,title:p.title,price:p.price,images:p.images,stock:true,main:true});cart.forEach(i=>{if(i.pid===p.id)i.ci++});ch=true}
save();if(ch){saveCart();R()}}
fixMain();setDeco();R();
